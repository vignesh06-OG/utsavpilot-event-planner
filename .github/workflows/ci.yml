name: CI - UtsavPilot Verification Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npx tsc -b

      - name: Run Vitest Automated Test Suite
        run: npm test

      - name: Build Production Client Bundle
        run: npm run build

